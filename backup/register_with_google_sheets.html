<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register || AlumniFest Afrique 2026</title>
    <!-- PHOSPHOR ICONS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.min.css">
    <script src="https://unpkg.com"></script>
    
    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="css/alumnifest.css">
    
    <!-- FORCED MOBILE MENU DISPLAY PATCH -->
    <style>
        @media screen and (max-width: 768px) {
            .menu-toggle {
                display: block !important;
            }
            /* Explicitly isolates the mobile link layer panel */
            nav.navbar ul.nav-links {
                display: none !important;
                flex-direction: column !important;
                position: absolute !important;
                top: 100% !important;
                left: 0 !important;
                width: 100% !important;
                background-color: #ffffff !important; /* Forces visible backdrop panel */
                padding: 1.5rem 5% !important;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2) !important;
                gap: 15px !important;
                z-index: 99999 !important;
            }
            /* Targeted high-specificity rule to break through browser caching */
            nav.navbar ul.nav-links.active {
                display: flex !important;
            }
            nav.navbar ul.nav-links li {
                width: 100% !important;
                text-align: left !important;
                display: block !important;
            }
            nav.navbar ul.nav-links li a {
                display: block !important;
                width: 100% !important;
                color: #000000 !important; /* Guarantees high-contrast readable links */
                font-size: 1.1rem !important;
                padding: 8px 0 !important;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <div class="alufest__logo">
                <img src="images/logo1.jpeg" alt="AlumniFest Afrique 2026 Logo">
            </div>
            <div class="logo">AlumniFest Afrique 2026</div>
        </div>
        
        <!-- Hamburger Menu for Mobile -->
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
            <i class="ph ph-list"></i>
        </button>

        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="speakers.html">Speakers</a></li>
            <li><a href="hosts.html">Hosts</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
        
        <div class="theme__btn" id="themeToggle">
            <i class="ph ph-sun"></i>
        </div>
    </nav>

    <section id="register">
        <h2 class="section-title">Registration Portal</h2>
        <div class="reg-container">
            <form id="regForm">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" required placeholder="e.g Senator Sahmicit">
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" required placeholder="e.g  SakSoullo">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="e.g.senator_saksoullo@email.com">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="e.g. 08012345678">
                </div>
                <div class="form-group">
                    <label for="cohort">Alma mater, Secondary School Old Boys/Old Girls Association, College, or University Alumni Association</label>
                    <input type="text" id="cohort" required placeholder="e.g., University of Jos, Gindiri Old Students Association, ABU Zaria Alumni Association">
                </div>
                <div class="form-group">
                    <label for="passType">Pass Tier</label>
                    <select id="passType">
                        <option value="Standard Festival Pass">Standard Festival Pass</option>
                        <option value="VIP Networking Pass">VIP Networking Pass</option>
                    </select>
                </div>
                <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%;">Register Now for AlumniFest Afrique 2026</button>
            </form>
        </div>
    </section>
  
    <footer>
        <p>Website by Zack Amata 08026005667 || &copy; AlumniFest Afrique 2026. Building Africa Through Alumni || Harnessing Tourism for Development.</p>
    </footer>

       <!-- SYSTEM FUNCTION SCRIPTS -->
    <script>
        // const googScriptURL = 'https://script.google.com/macros/s/AKfycbzcct6JxHBco-M31aUWD-yrfn7J5yWszvA7aaGFXfR85OHJGIWzBpCrjYxj4xOWN5dC3A/exec';
        // const googScriptURL = 'https://script.google.com/macros/s/AKfycbx_8kL1jZo6TGpeTYGu0DSeT2ZYQmU7hqsccNL8m6lQcRDHJqLLtVzKbKhY8mkyQGxA/exec';
        const googScriptURL = 'https://script.google.com/macros/s/AKfycbx_8kL1jZo6TGpeTYGu0DSeT2ZYQmU7hqsccNL8m6lQcRDHJqLLtVzKbKhY8mkyQGxA/exec';
        
        // 1. Mobile Hamburger Toggler
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                const icon = menuToggle.querySelector('i');
                if (navLinks.classList.contains('active')) {
                    icon.className = 'ph ph-x';
                } else {
                    icon.className = 'ph ph-list';
                }
            });
        }

        // 2. Theme Switcher Engine
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        function updateThemeIcon(theme) {
            if (!themeToggle) return;
            const themeIcon = themeToggle.querySelector('i');
            if (themeIcon) {
                if (theme === 'light') {
                    themeIcon.className = 'ph ph-sun';
                } else {
                    themeIcon.className = 'ph ph-moon';
                }
            }
        }

        if (themeToggle) {
            const savedTheme = localStorage.getItem('alufest-theme') || 'light';
            htmlElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);

            themeToggle.addEventListener('click', () => {
                const currentTheme = htmlElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                
                htmlElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('alufest-theme', newTheme);
                updateThemeIcon(newTheme);
            });
        }

        // 3. Google Sheets Submission Engine
        const regForm = document.getElementById('regForm');
        const submitBtn = document.getElementById('submitBtn');

        if (regForm) {
            regForm.addEventListener('submit', function(event) {
                event.preventDefault();
                
                submitBtn.disabled = true;
                submitBtn.innerText = 'Processing Registration...';

                // Format form values into parameters that matching Apps Script e.parameter reads
                const urlEncodedData = new URLSearchParams();
                urlEncodedData.append('firstName', document.getElementById('firstName').value);
                urlEncodedData.append('lastName', document.getElementById('lastName').value);
                urlEncodedData.append('email', document.getElementById('email').value);
                urlEncodedData.append('phone', document.getElementById('phone').value);
                urlEncodedData.append('cohort', document.getElementById('cohort').value);
                urlEncodedData.append('passType', document.getElementById('passType').value);

                fetch(googScriptURL, {
                    method: 'POST',
                    mode: 'no-cors', // Bypasses browser cross-origin locks
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: urlEncodedData.toString()
                })
                .then(() => {
                    alert('Success! Thank you, ' + document.getElementById('firstName').value + '. Your registration has been saved to the festival database.');
                    regForm.reset();
                })
                .catch(error => {
                    console.error('System Submission Error:', error);
                    alert('Submission error. Please check your internet connection.');
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Register Now for AlumniFest Afrique 2026';
                });
            });
        }
    </script>
</body>
</html>
