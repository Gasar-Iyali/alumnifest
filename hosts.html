        const cardGrid = document.getElementById('cardGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalClose = document.getElementById('modalClose');

        // Render 6 Responsive Cards (Fixed index target mapping)
        function renderCards() {
            cardGrid.innerHTML = sampleData.map(item => `
                <div class="card" onclick="openModal(${item.id})">
                    <div class="card-image-wrapper">
                        <img src="${item.images[0].url}" alt="${item.title}" loading="lazy">
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-description">${item.desc}</p>
                    </div>
                </div>
            `).join('');
        }

        // Open Modal with clean Alternating Wrapping Text Layout
        function openModal(id) {
            const data = sampleData.find(item => item.id === id);
            if (!data) return;

            modalTitle.textContent = data.title;

            // Distribute long copy evenly across images for true wrapping floats
            const textParagraphs = splitText(data.text, data.images.length);
            let combinedHTML = '';

            data.images.forEach((img, index) => {
                const alignmentClass = (index % 2 === 0) ? 'float-left' : 'float-right';
                combinedHTML += `
                    <figure class="inline-figure ${alignmentClass}">
                        <img src="${img.url}" alt="Showcase element ${index + 1}">
                        <figcaption class="inline-caption">${img.caption}</figcaption>
                    </figure>
                    <p>${textParagraphs[index] || ''}</p>
                `;
            });

            // Append any surplus paragraph blocks if present
            for (let i = data.images.length; i < textParagraphs.length; i++) {
                combinedHTML += `<p>${textParagraphs[i]}</p>`;
            }

            modalBody.innerHTML = combinedHTML;

            // Trigger Entry Animations safely
            modalOverlay.classList.add('active');
            modalOverlay.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            modalClose.focus();
        }

        // Helper split processor to balance text block wrapping
        function splitText(text, chunksCount) {
            const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
            const size = Math.ceil(sentences.length / chunksCount);
            const chunks = [];

            for (let i = 0; i < chunksCount; i++) {
                const chunkSentences = sentences.slice(i * size, (i + 1) * size);
                chunks.push(chunkSentences.join(' '));
            }

            return chunks;
        }

        // Close functions
        function closeModal() {
            modalOverlay.classList.remove('active');
            modalOverlay.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // Start
        renderCards();
    </script>

    <script>
        // 1. Mobile Hamburger Toggler
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                const icon = menuToggle.querySelector('i');
                if (navLinks.classList.contains('active')) {
                    icon.className = 'ph ph-x';
                } else {
                    icon.className = 'ph ph-list';
                }
            });
        }

        // 2. Theme Switcher Engine
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        function updateThemeIcon(theme) {
            if (!themeToggle) return;
            const themeIcon = themeToggle.querySelector('i');
            if (themeIcon) {
                if (theme === 'light') {
                    themeIcon.className = 'ph ph-sun';
                } else {
                    themeIcon.className = 'ph ph-moon';
                }
            }
        }

        if (themeToggle) {
            const savedTheme = localStorage.getItem('alufest-theme') || 'light';
            htmlElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);

            themeToggle.addEventListener('click', () => {
                const currentTheme = htmlElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                
                htmlElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('alufest-theme', newTheme);
                updateThemeIcon(newTheme);
            });
        }
    </script>
